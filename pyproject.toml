[project]
name = "imu-fall-benchmark"
version = "0.1.0"
description = "Reproducible CUDA benchmark for chest- and waist-mounted fall-detection IMU data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.12",
    "numpy>=2.0",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.9,<2",
]

[project.scripts]
imu-bench = "imu_benchmark.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imu_benchmark"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]
