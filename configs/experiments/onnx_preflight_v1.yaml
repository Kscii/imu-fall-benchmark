schema_version: 3
id: onnx_preflight_v1
contract_path: configs/contracts/imu_benchmark_contract_v2.json
snapshot_path: active.json
data_view_path: configs/data_views/temporal_core_v1.yaml
model_catalog_path: configs/models/fall_models_v1.yaml
alarm_policy_path: configs/evaluation/alarm_policies_v1.yaml
models:
  - threshold_impact
  - cuml_logistic_regression
  - cuml_random_forest
  - xgboost_cuda
  - torch_1d_cnn
  - torch_lstm
  - torch_cnn_lstm
folds: [0]
seeds: [3888]
seed_policy: deterministic_models_single_seed
training_recipes: [natural]
precision: fp32
gpu_mode: auto
max_epochs: 2
patience: 1
max_sequences_per_split: 600
max_windows_per_sequence: 48
cache_flush_windows: 16384
bootstrap_replicates: 0
export_onnx: true
data_quality_status: engineering_onnx_preflight_only
known_limitations:
  - This capped run validates conversion and Python ONNX Runtime parity only.
  - It is not model-comparison, Android-runtime, or product evidence.
