schema_version: 1
id: kfall_public_adl_smoke_v1
contract_path: configs/contracts/imu_benchmark_contract_v1.json
snapshot_path: data/snapshot_v1.json
data_view_path: configs/data_views/kfall_public_adl_v1.yaml
model_catalog_path: configs/models/fall_models_v1.yaml
models:
  - threshold_impact
  - cuml_logistic_regression
  - cuml_random_forest
  - xgboost_cuda
  - torch_1d_cnn
  - torch_lstm
  - torch_cnn_lstm
folds: [0]
seeds: [3888]
precision: fp32
gpu_mode: auto
runtime_budget_seconds: 900
max_epochs: 2
patience: 1
max_sequences_per_split: 600
max_windows_per_sequence: 48
cache_flush_windows: 16384
data_quality_status: provisional_research_view
known_limitations:
  - Public recording-labelled fall recordings are excluded; only public ADL windows supplement training.
  - KFall validation and test remain participant-disjoint and receive no public-data windows.
  - KFall adapter timing limitations still apply.
