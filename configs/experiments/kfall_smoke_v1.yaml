schema_version: 1
id: kfall_smoke_v1
contract_path: configs/contracts/imu_benchmark_contract_v1.json
snapshot_path: data/snapshot_v1.json
data_view_path: configs/data_views/kfall_temporal_v1.yaml
model_catalog_path: configs/models/fall_models_v1.yaml
models:
  - threshold_impact
  - cuml_logistic_regression
  - cuml_random_forest
  - xgboost_cuda
  - torch_1d_cnn
  - torch_lstm
  - torch_cnn_lstm
folds: [0]
seeds: [3888]
precision: fp32
gpu_mode: auto
runtime_budget_seconds: 900
max_epochs: 2
patience: 1
max_sequences_per_split: 600
max_windows_per_sequence: 48
cache_flush_windows: 16384
data_quality_status: provisional_kfall_adapter_v1
known_limitations: &kfall_limitations
  - KFall onset and impact points may be shifted by one 30 Hz sample in the current adapter output.
  - KFall uses the adapter-provided fall activity segment ending at impact plus one second.
  - Window false positives per hour are not product alarm episodes per hour.
