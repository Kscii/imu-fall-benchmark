schema_version: 2
id: temporal_smoke_v1
contract_path: configs/contracts/imu_benchmark_contract_v2.json
snapshot_path: active.json
data_view_path: configs/data_views/all_temporal_v1.yaml
model_catalog_path: configs/models/fall_models_v1.yaml
models:
  - threshold_impact
  - cuml_logistic_regression
  - cuml_random_forest
  - xgboost_cuda
  - torch_1d_cnn
  - torch_lstm
  - torch_cnn_lstm
folds: [0]
seeds: [3888]
precision: fp32
gpu_mode: auto
max_epochs: 2
patience: 1
max_sequences_per_split: 600
max_windows_per_sequence: 48
cache_flush_windows: 16384
data_quality_status: engineering_smoke_only
known_limitations:
  - This capped smoke run checks the complete execution path; it is not model-validation evidence.
  - Team recordings use training-only fold -1 and never enter validation or test folds.
  - Window false positives per hour are not product alarm episodes per hour.
