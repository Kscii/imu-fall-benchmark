model_catalog_path: configs/models/fall_models_v1.yaml
models:
  - threshold_impact
  - cuml_logistic_regression
  - cuml_random_forest
  - xgboost_cuda
  - torch_1d_cnn
  - torch_lstm
  - torch_cnn_lstm
folds: [0]
seeds: [3888]
precision: fp32
gpu_mode: auto
max_epochs: 50
patience: 8
max_sequences_per_split: null
