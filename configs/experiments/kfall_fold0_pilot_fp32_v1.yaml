known_limitations: &pilot_limitations
  - This single-fold engineering pilot is not formal model-validation evidence.
  - KFall onset and impact points may be shifted by one 30 Hz sample in the current adapter output.
  - KFall uses the adapter-provided fall activity segment ending at impact plus one second.
  - Window false positives per hour are not product alarm episodes per hour.
