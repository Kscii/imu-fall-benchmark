schema_version: 1
id: kfall_sequence_resident_smoke_v2
contract_path: configs/contracts/imu_benchmark_contract_v1.json
snapshot_path: data/snapshot_v2.json
data_view_path: configs/data_views/kfall_temporal_v1.yaml
model_catalog_path: configs/models/fall_models_v1.yaml
models:
  - torch_1d_cnn
  - torch_lstm
  - torch_cnn_lstm
folds: [0]
seeds: [3888]
precision: fp32
gpu_mode: resident
max_epochs: 2
patience: 1
max_sequences_per_split: 600
max_windows_per_sequence: 48
cache_flush_windows: 16384
data_quality_status: provisional_execution_mode_acceptance
known_limitations:
  - This config exists to verify the forced resident path, not to compare model quality.
  - KFall adapter timing limitations still apply.
